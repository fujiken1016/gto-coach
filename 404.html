<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ページが見つかりません | GTO Coach</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0d1230">
<style>
  :root{--bg0:#070a18;--bg1:#0d1230;--text:#eef2ff;--sub:#8b96c9;--cyan:#29e0ff}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:
      radial-gradient(1200px 500px at 50% -10%, #1b2454 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #2a1140 0%, transparent 55%),
      linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 100%);
    color:var(--text);min-height:100vh;line-height:1.8;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    display:flex;align-items:center;justify-content:center}
  .nf{max-width:560px;padding:48px 22px;text-align:center}
  .code{font-size:3.4rem;font-weight:800;color:var(--cyan);letter-spacing:.04em}
  h1{font-size:1.2rem;margin:10px 0 8px}
  p{color:var(--sub);font-size:.92rem}
  .back{display:inline-block;margin-top:28px;
    background:linear-gradient(135deg,var(--cyan),#4da3ff);color:#04121f;
    text-decoration:none;font-weight:800;font-size:.95rem;border-radius:12px;padding:14px 32px;
    box-shadow:0 4px 16px rgba(41,224,255,.3)}
</style>
</head>
<body>
<div class="nf">
  <div class="code">404</div>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは移動したか、削除された可能性があります。</p>
  <a class="back" href="/">GTO Coach トップへ</a>
</div>
</body>
</html>
